name: Orchestration evidence replays

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m venv "$RUNNER_TEMP/orch-evidence"
      - run: |
          "$RUNNER_TEMP/orch-evidence/bin/python" -m pip install -r scripts/orch/requirements.txt
      - run: |
          "$RUNNER_TEMP/orch-evidence/bin/python" -m unittest discover -s test/orch -p 'test_*.py' -v
