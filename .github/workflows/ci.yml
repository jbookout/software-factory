# The one required check. It runs on every pull request and again in the
# merge queue, on the exact tree that will land on main. Pushes to main are
# not re-tested: deploy.yml takes over from there.
name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser tests need Chromium; projects without Playwright skip this.
      - name: Install Chromium when the project uses Playwright
        run: |
          if npm ls playwright --depth=0 >/dev/null 2>&1; then
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm run check
