name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  push:
    branches: [main]

concurrency:
  # PR validation supersedes by workflow + PR. Non-PR verdicts are independent:
  # sharing a non-cancelling group would still replace older pending runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: python3 capabilities/jev-browser-select/test_select.py
