name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  push:
    branches: [main]

concurrency:
  # PR validation supersedes by workflow + PR. Non-PR verdicts are independent:
  # sharing a non-cancelling group would still replace older pending runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Install pinned Python check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/factory-check"
          "$RUNNER_TEMP/factory-check/bin/python" -m pip install -r scripts/orch/requirements.txt
          echo "$RUNNER_TEMP/factory-check/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5
      - run: npm run check
        timeout-minutes: 45

      - name: Audit installed workflow configuration (non-blocking pilot)
        continue-on-error: true
        run: npm run workflow:audit -- .

  e2e-deterministic-qualification:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            capabilities/agentic-ui-evaluation/fixture/package-lock.json
      - run: npm ci
      - run: npm ci --prefix capabilities/agentic-ui-evaluation/fixture
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: capabilities/agentic-ui-evaluation/fixture
      - run: npm run e2e:qualify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-deterministic-qualification
          path: capabilities/agentic-ui-evaluation/fixture/.qualification/
          include-hidden-files: true
          if-no-files-found: error
