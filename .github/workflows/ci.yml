name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Python check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/factory-check"
          "$RUNNER_TEMP/factory-check/bin/python" -m pip install -r scripts/orch/requirements.txt
          echo "$RUNNER_TEMP/factory-check/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5
      - name: Install pinned Chromium for presentation acceptance
        run: npx --no-install playwright install --with-deps chromium
        timeout-minutes: 5
      - run: npm run check

      - name: Audit installed workflow configuration (non-blocking pilot)
        continue-on-error: true
        run: npm run workflow:audit -- .
      - run: npm ci --prefix capabilities/agentic-ui-evaluation/fixture
      - run: npm exec --no -- playwright install --with-deps chromium
        working-directory: capabilities/agentic-ui-evaluation/fixture
      - run: npm test
        working-directory: capabilities/agentic-ui-evaluation/fixture
