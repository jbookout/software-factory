name: CI capability image maintenance
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-capability-images
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {profile: both, dockerfile: ci/postgres/Dockerfile}
          - {profile: browser, dockerfile: ci/capabilities/Dockerfile}
          - {profile: app, dockerfile: ci/capabilities/Dockerfile}
          - {profile: backup, dockerfile: ci/capabilities/Dockerfile}
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - name: Build and qualify offline inside the image
        uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.profile }}
          load: true
          tags: ci-postgres:qualification
      - name: Qualify the real image as the job user
        id: qualify
        shell: bash
        run: |
          python3 ci/capabilities/capabilities.py collect "${{ matrix.profile }}" --image ci-postgres:qualification --commit "${{ github.sha }}" --directory qualification
          cp qualification/qualification.json qualification.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: DoctorCRE/carr-system
          ref: 6aeb09e0d766015754ea7ebb160180ef14090f3f
          path: out/carr-consumer
          persist-credentials: false
      - name: Build the pinned CARR HxStore consumer with the image toolchain
        if: matrix.profile == 'both' || matrix.profile == 'app'
        timeout-minutes: 5
        run: |
          docker run --rm --init -v "$PWD/out/carr-consumer:/consumer:ro" ci-postgres:qualification cargo build --locked --release --manifest-path /consumer/vendor/hxprobe/Cargo.toml --target-dir /tmp/hxprobe-target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Prove the CARR signal assertion detects an unreaped namespace
        if: matrix.profile == 'both' || matrix.profile == 'app'
        timeout-minutes: 3
        run: |
          if docker run --rm --network none -v "$PWD/out/carr-consumer:/consumer:ro" ci-postgres:qualification python /consumer/ops/disposable-pg-selftest.py Lifecycle.test_sigterm_stops_postmaster_and_removes_owned_directory > no-init.log 2>&1; then
            cat no-init.log
            exit 1
          fi
          cat no-init.log
          grep -q 'ProcessLookupError not raised' no-init.log
      - name: Exercise the pinned CARR browser, hook, signal, kill and jq consumers
        if: matrix.profile == 'both' || matrix.profile == 'app'
        timeout-minutes: 10
        run: |
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          mkdir -p out/materialized
          chmod 777 out/materialized
          docker run --rm --init -v "$NODE_ROOT:/opt/node:ro" -v "$PWD/out/carr-consumer:/consumer:ro" -v "$PWD/out/materialized:/prepared" ci-postgres:qualification bash -ec '
            export PATH="/opt/node/bin:$PATH"
            cp -a /consumer/. /prepared/
            cd /prepared
            python -m venv .venv
            export PATH="$PWD/.venv/bin:$PATH"
            timeout 240 python -m pip install -r requirements.lock
            timeout 240 npm --prefix practice-plugin ci --ignore-scripts
          '
          docker run --rm --init --network none -e GITHUB_ACTIONS=true -v "$NODE_ROOT:/opt/node:ro" -v "$PWD/out/materialized:/prepared" ci-postgres:qualification bash -ec '
            cd /prepared
            export PATH="$PWD/.venv/bin:/opt/node/bin:$PATH"
            python ops/cloud-hook-paths-selftest.py
            timeout 120 python ops/config-as-code-launchd-selftest.py
            timeout 120 python ops/github-gh-caller-selftest.py
            timeout 120 python ops/github-rate-limit-selftest.py
            python ops/disposable-pg-selftest.py
            timeout 300 npm --prefix practice-plugin test
          '
      - name: Deliberately broken image must fail qualification
        if: matrix.profile == 'both' || matrix.profile == 'app'
        run: |
          for fault in missing-binary wrong-major missing-vector failed-sql missing-rustc missing-cargo missing-browser missing-bootstrap-python broken-jq; do
            case "$fault" in
              broken-jq) mutation='printf "#!/bin/sh\\nexit 42\\n" > /usr/bin/jq' ;;
              missing-browser) mutation='rm /usr/bin/chromium' ;;
              missing-bootstrap-python) mutation='rm /usr/bin/python3' ;;
              missing-rustc) mutation='rm /usr/local/cargo/bin/rustc' ;;
              missing-cargo) mutation='rm /usr/local/cargo/bin/cargo' ;;
              missing-binary) mutation='rm /usr/lib/postgresql/17/bin/initdb' ;;
              wrong-major) mutation='cp /usr/lib/postgresql/18/bin/postgres /usr/lib/postgresql/17/bin/postgres' ;;
              missing-vector) mutation='rm /usr/share/postgresql/17/extension/vector.control' ;;
              failed-sql) mutation='cp /bin/false /usr/lib/postgresql/17/bin/psql' ;;
            esac
            printf 'FROM ci-postgres:qualification\nUSER root\nRUN %s\nUSER 1001:1001\n' "$mutation" | docker build -t ci-postgres:broken -
            if docker run --rm --init --network none ci-postgres:broken python /opt/ci/qualify.py > "broken-$fault.log" 2>&1; then
              cat "broken-$fault.log"
              exit 1
            fi
            cat "broken-$fault.log"
            grep -q 'qualification failed:' "broken-$fault.log"
          done
      - name: Missing capability and wrong version must fail without repair
        run: python3 ci/capabilities/negative_controls.py "${{ matrix.profile }}" ci-postgres:qualification
      - name: Preserve lifecycle evidence
        if: always()
        run: |
          mkdir -p qualification
          cp broken-*.log no-init.log qualification/ 2>/dev/null || test ! -f no-init.log
      - name: Archive the qualified bytes
        run: docker save ci-postgres:qualification -o qualification/image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ci-image-${{ matrix.profile }}
          compression-level: 0
          path: qualification/
  publish:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      max-parallel: 1
      matrix:
        profile: [both, browser, app, backup]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37e0f0480
        with:
          name: ci-image-${{ matrix.profile }}
          path: qualification
      - uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the qualified archive without rebuilding
        id: publish
        env:
          IMAGE: ghcr.io/jbookout/software-factory/ci-${{ matrix.profile }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker load -i qualification/image.tar
          python3 ci/capabilities/capabilities.py preflight "${{ matrix.profile }}" --image ci-postgres:qualification --commit "${{ github.sha }}" --directory qualification
          docker tag ci-postgres:qualification "$IMAGE"
          docker push "$IMAGE"
          python3 ci/capabilities/capabilities.py promote "${{ matrix.profile }}" --image "$IMAGE" --commit "${{ github.sha }}" --directory qualification
          cat qualification/pin.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-image-pin-${{ matrix.profile }}
          path: |
            qualification/pin.json
            qualification/qualification.json
            qualification/manifest.json
            qualification/sbom.spdx.json
  pins:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37e0f0480
        with:
          pattern: ci-image-pin-*
          path: pins
      - id: pins
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pins = [json.loads(path.read_text()) for path in sorted(Path('pins').glob('*/pin.json'))]
          assert {pin['profile'] for pin in pins} == {'both', 'browser', 'app', 'backup'}
          print('matrix=' + json.dumps({'include': [{'profile': pin['profile'], 'image': pin['image']} for pin in pins]}))
          PY
  job-container:
    needs: pins
    strategy:
      max-parallel: 2
      matrix: ${{ fromJSON(needs.pins.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      options: --init
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the published job container and writable workspace
        run: |
          test "$(id -u)" = 1001
          python3 /opt/ci/capabilities.py verify "${{ matrix.profile }}"
          touch "$HOME/qualification-write" "$RUNNER_TEMP/qualification-write" "$GITHUB_WORKSPACE/qualification-write"
