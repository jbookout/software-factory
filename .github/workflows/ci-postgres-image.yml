name: PostgreSQL CI image
on:
  pull_request:
    paths: ['ci/postgres/**', '.github/workflows/ci-postgres-image.yml', 'test/ci-postgres-image.test.mjs', 'package.json']
  merge_group:
  push:
    branches: [main]
    paths: ['ci/postgres/**', '.github/workflows/ci-postgres-image.yml']
permissions:
  contents: read
concurrency:
  group: ci-postgres-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - name: Build and qualify offline inside the image
        uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: .
          file: ci/postgres/Dockerfile
          target: both
          load: true
          tags: ci-postgres:qualification
      - name: Qualify the real image as the job user
        id: qualify
        shell: bash
        run: |
          docker run --rm --network none ci-postgres:qualification python /opt/ci/qualify.py | tee qualification.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: DoctorCRE/carr-system
          ref: bd5c4984190293c51c2bd3a6e192525468156630
          path: out/carr-consumer
          persist-credentials: false
      - name: Build the pinned CARR HxStore consumer with the image toolchain
        timeout-minutes: 5
        run: |
          docker run --rm -v "$PWD/out/carr-consumer:/consumer:ro" ci-postgres:qualification cargo build --locked --release --manifest-path /consumer/vendor/hxprobe/Cargo.toml --target-dir /tmp/hxprobe-target
      - name: Deliberately broken image must fail qualification
        run: |
          for fault in missing-binary wrong-major missing-vector failed-sql missing-rustc missing-cargo; do
            case "$fault" in
              missing-rustc) mutation='rm /usr/local/cargo/bin/rustc' ;;
              missing-cargo) mutation='rm /usr/local/cargo/bin/cargo' ;;
              missing-binary) mutation='rm /usr/lib/postgresql/17/bin/initdb' ;;
              wrong-major) mutation='cp /usr/lib/postgresql/18/bin/postgres /usr/lib/postgresql/17/bin/postgres' ;;
              missing-vector) mutation='rm /usr/share/postgresql/17/extension/vector.control' ;;
              failed-sql) mutation='cp /bin/false /usr/lib/postgresql/17/bin/psql' ;;
            esac
            printf 'FROM ci-postgres:qualification\nUSER root\nRUN %s\nUSER 1001:1001\n' "$mutation" | docker build -t ci-postgres:broken -
            if docker run --rm --network none ci-postgres:broken python /opt/ci/qualify.py > "broken-$fault.log" 2>&1; then
              cat "broken-$fault.log"
              exit 1
            fi
            cat "broken-$fault.log"
            grep -q 'qualification failed:' "broken-$fault.log"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: postgres-image-qualification
          path: |
            qualification.json
            broken-*.log
  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish qualified both profile
        id: publish
        uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: .
          file: ci/postgres/Dockerfile
          target: both
          push: true
          provenance: mode=max
          tags: ghcr.io/jbookout/software-factory/ci-postgres:both-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jbookout/software-factory
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record consumer pin
        if: steps.publish.outcome == 'success'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "ghcr.io/jbookout/software-factory/ci-postgres@$DIGEST" | tee image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: postgres-image-digest
          path: image-digest.txt
  job-container:
    permissions:
      contents: read
      packages: read
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/jbookout/software-factory/ci-postgres@${{ needs.publish.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Prove job-container permissions and lifecycle
        run: |
          test "$(id -u)" = 1001
          python /opt/ci/qualify.py | tee job-container-qualification.json
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" --version
          npm ci --ignore-scripts
          touch "$HOME/qualification-write" "$RUNNER_TEMP/qualification-write" "$GITHUB_WORKSPACE/qualification-write"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: postgres-job-container
          path: job-container-qualification.json
